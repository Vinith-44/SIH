# /etc/chrony/conf.d/storemind.conf - the Pi is the shop's clock (docs/SETUP_PI5.md §4).
#
# Why: event timestamps from the cameras (via the DVR), the STM32 ($S sync from the Pi) and the
# Pi must agree, or a queue timer or a beam-vs-camera cross-check compares the wrong seconds.
# The internet pool servers come from the distribution's chrony.conf.

# Serve NTP to the DVR / NVR / IP cameras on the shop LAN (private ranges).
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# Keep serving when the internet is down: the Pi 5 RTC keeps the clock through power cuts,
# and "local" lets chrony still answer the DVR (at a stratum that shows it is not synced upstream).
local stratum 10 orphan

# Step the clock at boot if it is far off (first 3 updates), and keep the RTC in step.
# (Harmless if the distribution's chrony.conf already says the same.)
makestep 1.0 3
rtcsync
