# Mosquitto for StoreMind: local only, password required, persistent.
# Installed to /etc/mosquitto/conf.d/storemind.conf by scripts/install_pi5.sh.
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/storemind.passwd
persistence true
autosave_interval 60
# Retained states (QUEUE_STATE, HEALTH, ...) survive a broker restart.
max_queued_messages 5000
