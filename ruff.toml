# Shared lint settings, so `ruff check .` gives the same answer on both laptops
# and in CI.  Without this file the result depended on which directory you stood
# in and which ruff you happened to have: 0.16's defaults enable far more rules
# than 0.6's, so the same code linted clean for one of us and red for the other.
# CI pins the ruff version to match (.github/workflows/ci.yml).

target-version = "py313"

# `legacy/` is the pre-StoreMind code kept for reference and comparison
# (storemind/storemind/eval/legacy_baseline.py measures against it). It is not
# maintained and never will be, and it accounts for 61 of the 76 findings a
# default run reports - enough noise to make the gate worthless.
extend-exclude = ["legacy", "research/tools"]

[lint]
# Ruff's classic default set: real errors, not style opinions.
#   E4 imports · E7 statements · E9 syntax/IO errors · F pyflakes
# Deliberately a floor, not a ceiling. The wider families (I, B, S, UP, SIM,
# RUF, ...) flag another ~100 things across the tree that are worth fixing, but
# turning them on in the same change would mean rewriting code both of us are
# actively working in. Raise this once M2-M9 have landed.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests and tools put imports after a sys.path insert so they can be run
# directly as scripts; that is the repo's established pattern, not an accident.
"storemind/tests/*" = ["E402"]
"storemind/tools/*" = ["E402"]
"tools/*" = ["E402"]
