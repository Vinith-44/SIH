# StoreMind secrets - TEMPLATE.  Copy to configs/secrets.yaml (git-ignored) and
# fill in real values there.  Never put real values in this file.
#
# Every value can also come from an environment variable, which wins:
#   STOREMIND_MQTT_USERNAME / STOREMIND_MQTT_PASSWORD
#   STOREMIND_CAM_<NAME>_USERNAME / _PASSWORD   (name upper-cased, "-" -> "_")
#
# The Qualcomm AI Hub token does NOT go here: run `qai-hub configure
# --api_token <TOKEN>` (stored in your home folder) or set QAI_HUB_API_TOKEN.

mqtt:
  username: storemind
  password: CHANGE_ME

cameras:
  # Keys are camera names from store.yaml. Use a read-only live-view DVR user.
  entrance:
    username: viewer
    password: CHANGE_ME
  counter-1:
    username: viewer
    password: CHANGE_ME
