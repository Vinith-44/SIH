name: CI

on:
  push:
    branches: [master]
  # Every PR, whatever its base, so stacked PRs (b/m5b on top of b/m5a) get checks too.
  pull_request:
  workflow_dispatch:

# A newer push to the same PR/branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the laptop venvs. requirements.txt says "tested on 3.11", but both
  # of us run 3.13 and every pin resolves there, so CI tests what we actually use.
  PYTHON_VERSION: "3.13"
  # Pinned to the version we lint with locally. A newer ruff enables new rules
  # and would fail a PR that passes on the laptop; 0.16's defaults are already
  # far wider than 0.6's, which is why ruff.toml states the rule set explicitly.
  RUFF_VERSION: "0.16.8"
  MEDIAMTX_VERSION: "v1.21.1"
  GO2RTC_VERSION: "v1.9.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: test (pytest, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: storemind/requirements.txt
      - name: System packages (ffmpeg, OpenCV runtime)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg libgl1
      - name: CPU-only PyTorch (avoids the multi-GB CUDA wheels)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Project requirements
        run: pip install -r storemind/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: pytest
        # From the repo root: storemind/tests is a package, so pytest puts
        # storemind/ on sys.path itself and `import storemind.x` resolves.
        run: pip install pytest && pytest -q
      - name: sensor e2e (STM32 simulator -> bridge -> SQLite)
        run: python tools/e2e_sensors.py

  firmware-host:
    name: firmware (host C tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The protocol and logic libraries are portable C with no HAL: the same
      # files are compiled into the STM32 firmware and, here, into PC test binaries.
      # firmware/stm32/logic builds both (it pulls in ../protocol).
      - name: gcc, -Werror -Wconversion
        run: |
          cmake -S firmware/stm32/logic -B build/host-gcc -DCMAKE_C_COMPILER=gcc
          cmake --build build/host-gcc
          ctest --test-dir build/host-gcc --output-on-failure
      - name: clang (stricter -Wconversion, includes sign changes)
        run: |
          cmake -S firmware/stm32/logic -B build/host-clang -DCMAKE_C_COMPILER=clang
          cmake --build build/host-clang
          ctest --test-dir build/host-clang --output-on-failure
      - name: AddressSanitizer + UBSan
        run: |
          cmake -S firmware/stm32/logic -B build/host-asan -DCMAKE_C_COMPILER=gcc \
            -DSM_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host-asan
          ctest --test-dir build/host-asan --output-on-failure

  firmware-build:
    name: firmware (STM32F103 build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Arm GNU toolchain + Ninja
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
          arm-none-eabi-gcc --version | head -1
      - name: Build (HAL, CMSIS and FreeRTOS fetched and hash-checked by CMake)
        run: |
          cmake -S firmware/stm32 -B build/fw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/firmware/stm32/cmake/arm-none-eabi.cmake"
          cmake --build build/fw
      - name: Flash / RAM budget (64 KB part, 20 KB RAM)
        # Headroom on the Blue Pill: at most 60 KB of the 63 KB code area and
        # 18 KB of RAM (the rest is the main stack).  Over budget fails the PR.
        run: |
          read -r text data bss _ < <(arm-none-eabi-size build/fw/storemind_node.elf | tail -1)
          flash=$((text + data)); ram=$((data + bss))
          echo "flash=${flash} B ram=${ram} B" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$flash" -le 61440 && test "$ram" -le 18432
      - uses: actions/upload-artifact@v4
        with:
          name: storemind-node-firmware
          path: |
            build/fw/storemind_node.elf
            build/fw/storemind_node.hex
            build/fw/storemind_node.bin
            build/fw/storemind_node.map
          retention-days: 14

  e2e:
    name: e2e (fake CCTV -> go2rtc -> reader)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check M2 files are present
        id: m2
        run: |
          if [ -f tools/e2e_smoke.py ] && [ -d storemind/storemind/ingest ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::M2 files not on this branch yet; skipping e2e."
          fi
      - uses: actions/setup-python@v5
        if: steps.m2.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ffmpeg + OpenCV (headless is enough for ingest)
        if: steps.m2.outputs.present == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          pip install opencv-python-headless numpy
      - name: MediaMTX + go2rtc into tools/bin
        if: steps.m2.outputs.present == 'true'
        run: |
          mkdir -p tools/bin
          curl -fsSL -o /tmp/mediamtx.tgz \
            "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/mediamtx.tgz -C tools/bin mediamtx
          curl -fsSL -o tools/bin/go2rtc \
            "https://github.com/AlexxIT/go2rtc/releases/download/${GO2RTC_VERSION}/go2rtc_linux_amd64"
          chmod +x tools/bin/mediamtx tools/bin/go2rtc
          tools/bin/go2rtc -version
      - name: e2e smoke test
        if: steps.m2.outputs.present == 'true'
        run: python tools/e2e_smoke.py
