<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="40" y="58" font-size="34" font-weight="700" fill="#1f2937" text-anchor="start">Plugs into the CCTV a store already has</text>
<text x="40" y="88" font-size="18" font-weight="400" fill="#4b5563" text-anchor="start">One cable to the existing recorder, one read-only login. The shop&#x27;s own recording is never touched, and no video leaves the box.</text>
<text x="40" y="135" font-size="18" font-weight="700" fill="#0284c7" text-anchor="start">1 · STORE&#x27;S EXISTING CCTV</text>
<rect x="40" y="150" width="240" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="54" y="180.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Entrance camera</text>
<text x="54" y="205.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">analog-HD or IP</text>
<line x1="280" y1="185" x2="318" y2="300" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="234" width="240" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="54" y="264.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Counter camera</text>
<text x="54" y="289.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">usually already there</text>
<line x1="280" y1="269" x2="318" y2="300" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="318" width="240" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="54" y="348.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Aisle / shelf camera</text>
<text x="54" y="373.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">often low angle</text>
<line x1="280" y1="353" x2="318" y2="310" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="320" y="230" width="230" height="150" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="334" y="281.0" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">DVR / NVR</text>
<text x="334" y="307.0" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">CP Plus · Hikvision/Prama</text>
<text x="334" y="327.0" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">Dahua · any ONVIF</text>
<text x="334" y="347.0" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">keeps recording as usual</text>
<rect x="40" y="600" width="240" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="54" y="630.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Wi-Fi IP camera</text>
<text x="54" y="655.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Ezykam / Tapo (RTSP)</text>
<rect x="40" y="686" width="240" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="54" y="716.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Our add-on camera</text>
<text x="54" y="741.0" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Pi Cam 3 / ESP32-S3 shelf</text>
<rect x="330" y="420" width="220" height="110" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2" stroke-dasharray="7 5"/>
<text x="344" y="448" font-size="18" font-weight="700" fill="#a16207" text-anchor="start">Private link</text>
<text x="344" y="474" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">USB-Ethernet → DVR LAN port</text>
<text x="344" y="496" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">read-only live-view user</text>
<text x="344" y="518" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">RTSP over TCP, sub-stream</text>
<rect x="600" y="118" width="560" height="632" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
<text x="620" y="150" font-size="18" font-weight="700" fill="#334155" text-anchor="start">2 · STOREMIND EDGE BOX</text>
<text x="840" y="150" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">Raspberry Pi 5 → Qualcomm QCS6490</text>
<rect x="620" y="170" width="520" height="96" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="634" y="203.5" font-size="19" font-weight="700" fill="#ea580c" text-anchor="start">Camera gateway (go2rtc)</text>
<text x="634" y="229.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">ONE connection per camera → restream rtsp://127.0.0.1:8554/&lt;cam&gt;</text>
<text x="634" y="249.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">ONVIF discovery · health watchdog · auto-reconnect</text>
<line x1="435" y1="380" x2="435" y2="418" stroke="#0284c7" stroke-width="2.5" marker-end="url(#ah)"/>
<polyline points="550,475 585,475 585,218 618,218" fill="none" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#ah)"/>
<polyline points="280,635 572,635 572,240 618,240" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<polyline points="280,721 560,721 560,256 618,256" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="300" y="628" font-size="13" font-weight="400" fill="#0284c7" text-anchor="start">Wi-Fi / add-on cameras (RTSP, snapshots)</text>
<rect x="620" y="300" width="250" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="634" y="331.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Live sub-streams</text>
<text x="634" y="357.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">entrance 8–10 FPS</text>
<text x="634" y="377.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">counter 3–5 FPS</text>
<text x="634" y="397.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">640×360 – 720p</text>
<rect x="890" y="300" width="250" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="904" y="331.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Snapshots (JPEG)</text>
<text x="904" y="357.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">shelves every 1–5 min</text>
<text x="904" y="377.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">ISAPI / snapshot.cgi</text>
<text x="904" y="397.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">near-zero load</text>
<line x1="745" y1="266" x2="745" y2="298" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1015" y1="266" x2="1015" y2="298" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="620" y="446" width="520" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="634" y="487.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Analytics (frames stay in RAM)</text>
<text x="634" y="513.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">footfall · queues + forecast · shelf slots · fusion with STM32 sensors</text>
<line x1="745" y1="412" x2="745" y2="444" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1015" y1="412" x2="1015" y2="444" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="620" y="572" width="520" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="634" y="607.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Events only (~200 bytes each)</text>
<text x="634" y="633.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">SQLite on the box · ONVIF Profile M-style JSON over MQTT</text>
<line x1="880" y1="538" x2="880" y2="570" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="620" y="690" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">15-minute onboarding:</text>
<text x="620" y="714" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">permission → read-only user → discover → probe → calibrate → validate</text>
<text x="1200" y="135" font-size="18" font-weight="700" fill="#059669" text-anchor="start">3 · OUTPUTS</text>
<rect x="1200" y="150" width="360" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1214" y="195.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Dashboard + phones</text>
<text x="1214" y="221.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">over shop Wi-Fi, offline</text>
<rect x="1200" y="268" width="360" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1214" y="313.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Staff alerts</text>
<text x="1214" y="339.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">tower light · voice · phone</text>
<rect x="1200" y="386" width="360" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1214" y="421.5" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Existing VMS / HQ</text>
<text x="1214" y="447.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">Profile M-style events,</text>
<text x="1214" y="467.5" font-size="15" font-weight="400" fill="#4b5563" text-anchor="start">aggregates only</text>
<line x1="1160" y1="612" x2="1198" y2="420" stroke="#059669" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="40" y="780" width="1520" height="76" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="192.0" y="826" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="middle">Recording untouched</text>
<text x="496.0" y="826" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="middle">Read-only login</text>
<text x="800.0" y="826" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="middle">Frames never leave RAM</text>
<text x="1104.0" y="826" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="middle">No internet needed</text>
<text x="1408.0" y="826" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="middle">CP Plus · Hikvision · Dahua · ONVIF</text>
</svg>